<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Source/style/mane.css">
    <link rel="stylesheet" href="Source/style/checkout.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap"
          rel="stylesheet">
    <link rel="icon" href="Source/file/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="Source/file/favicon.ico" type="image/x-icon">

    <script type="module" src="Source/javascript/checkout.js" defer ></script>
<!--<script src="Source/javascript/main.js" defer></script>-->

    <title>Оплата заказа</title>

</head>
<body>

   <section>

   <div class="container">
      <h1>Оформление заказа</h1>

      <!-- Блок с товарами из корзины -->
      <section class="cart-summary">
         <h2>Ваш заказ</h2>
         <div id="cart-items"></div>   <!-- Сюда динамически подставим товары -->
         <div class="total">
            <strong>Итого:</strong> <span id="total-amount">0</span> $
         </div>
      </section>

      <!-- Форма оплаты -->
      <section class="payment-form">
         <h2>Данные карты</h2>
         <form id="payment-form">
            <div class="form-group">
               <label for="card-number">Номер карты</label>
               <input type="text" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" inputmode="numeric" autocomplete="cc-number">
               <small class="error" id="card-number-error"></small>
            </div>

            <div class="form-row">
               <div class="form-group">
                  <label for="expiry">Срок действия</label>
                  <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" inputmode="numeric" autocomplete="cc-exp">
                  <small class="error" id="expiry-error"></small>
               </div>
               <div class="form-group">
                  <label for="cvv">CVV</label>
                  <input type="text" id="cvv" placeholder="123" maxlength="3" inputmode="numeric" autocomplete="cc-csc">
                  <small class="error" id="cvv-error"></small>
               </div>
            </div>
            <div class="payment-submit">
               <button type="submit" id="pay-button">Оплатить</button>
               <div class="spinner" id="spinner" style="display: none;"></div>
            </div>
            <div id="payment-status"></div> <!-- Для сообщений об успехе/ошибке -->
         </form>
      </section>
   </div>

   </section>

</body>
</html>
